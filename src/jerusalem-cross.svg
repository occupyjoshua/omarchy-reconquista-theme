<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Jerusalem cross: arms of the Kingdom of Jerusalem. Original drawing, CC0. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcb867"/>
      <stop offset=".5" stop-color="#b8923a"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <g id="greek">
      <rect x="-18" y="-72" width="36" height="144"/>
      <rect x="-72" y="-18" width="144" height="36"/>
    </g>
  </defs>
  <g fill="url(#gold)">
    <rect x="456" y="150" width="88" height="700"/>
    <rect x="150" y="456" width="700" height="88"/>
    <rect x="350" y="120" width="300" height="64"/>
    <rect x="350" y="816" width="300" height="64"/>
    <rect x="120" y="350" width="64" height="300"/>
    <rect x="816" y="350" width="64" height="300"/>
    <use href="#greek" x="300" y="300"/>
    <use href="#greek" x="700" y="300"/>
    <use href="#greek" x="300" y="700"/>
    <use href="#greek" x="700" y="700"/>
  </g>
